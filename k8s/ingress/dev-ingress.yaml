apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azureshop-ingress
  namespace: dev
  annotations:
    # Use the NGINX ingress controller installed in ingress-nginx namespace
    kubernetes.io/ingress.class: "nginx"
    # Strip /api prefix before forwarding to api-gateway
    # api-gateway nginx.conf expects paths like /api/users/, /api/products/ etc.
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Increase proxy timeouts for slow backend responses
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # All /api/* traffic → api-gateway
          # api-gateway's nginx.conf handles routing to individual services
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

          # Everything else → frontend (Next.js)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
