# Required for nginx-unprivileged — non-root user cannot write to /run/nginx.pid
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # Temp paths — nginx-unprivileged cannot write to default /var/cache/nginx paths
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # ── Logging ─────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Timeouts ─────────────────────────────────────────────────────────
  keepalive_timeout    65;
  proxy_read_timeout   30s;
  proxy_connect_timeout 5s;
  proxy_send_timeout   30s;

  # ── Rate Limiting ─────────────────────────────────────────────────────
  # Shared memory zone: 10MB stores ~160k IP states
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  # ── Upstream service definitions ──────────────────────────────────────
  # In Kubernetes, these resolve via DNS to ClusterIP Services
  # Service name = Kubernetes Service name in the same namespace
  upstream user_service {
    server user-service:3001;
  }

  upstream product_service {
    server product-service:3002;
  }

  upstream cart_service {
    server cart-service:3003;
  }

  upstream order_service {
    server order-service:3004;
  }

  upstream payment_service {
    server payment-service:3005;
  }

  upstream frontend {
    server frontend:3000;
  }

  # ── Main server block ─────────────────────────────────────────────────
  server {
    listen 8080;
    server_name _;

    # ── NGINX health check ──────────────────────────────────────────────
    location /health {
      access_log off;
      return 200 '{"status":"ok","service":"api-gateway"}';
      add_header Content-Type application/json;
    }

    # ── NGINX stub_status — scraped by Prometheus nginx-exporter sidecar ──
    # Exposes: active connections, requests accepted/handled, reading/writing/waiting
    location /nginx_status {
      stub_status on;
      access_log off;
      allow 127.0.0.1;   # only allow localhost (sidecar scrapes via loopback)
      deny all;
    }

    # ── Auth routes — stricter rate limit ──────────────────────────────
    location /api/users/auth/ {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass http://user_service/auth/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── User routes ────────────────────────────────────────────────────
    location /api/users/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://user_service/users/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Product routes ─────────────────────────────────────────────────
    location /api/products/ {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://product_service/products/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Cart routes ────────────────────────────────────────────────────
    location /api/cart/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://cart_service/cart/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Order routes ───────────────────────────────────────────────────
    location /api/orders/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass http://order_service/orders/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Payment routes ─────────────────────────────────────────────────
    location /api/payments/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass http://payment_service/payments/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Frontend — catch-all ───────────────────────────────────────────
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
  }
}
