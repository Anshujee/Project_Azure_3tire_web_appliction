image:
  repository: acrazureshopdev.azurecr.io/cart-service
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 3003
  targetPort: 3003

env:
  - name: PORT
    value: "3003"
  - name: NODE_ENV
    value: "production"

# Key Vault CSI — injects Redis credentials as env vars
  - name: APPLICATIONINSIGHTS_CONNECTION_STRING
    valueFrom:
      secretKeyRef:
        name: cart-service-secrets
        key: APPINSIGHTS_CONNECTION_STRING
        optional: true
secretProviderClass:
  enabled: true
  name: cart-service-secrets
  secretName: cart-service-secrets
  # Injected env vars: REDIS_HOST, REDIS_PORT, REDIS_PASSWORD

probes:
  path: /health

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

hpa:
  minReplicas: 2
  maxReplicas: 10
  cpuUtilizationPercentage: 70

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  annotations: {}
