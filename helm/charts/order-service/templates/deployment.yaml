apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "azureshop.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azureshop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "azureshop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "azureshop.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "azureshop.name" . }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # runAsNonRoot and runAsUser hardened in Phase 8 once UIDs are confirmed per image
      # Spread pods across nodes — prevents all replicas landing on one node
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "azureshop.selectorLabels" . | nindent 14 }}
      containers:
        - name: {{ include "azureshop.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Non-sensitive config from values.yaml
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          # Sensitive config injected from the Kubernetes Secret that the
          # CSI driver creates when it mounts the Key Vault volume below
          {{- if .Values.secretProviderClass.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretProviderClass.secretName }}
          {{- end }}
          # Startup probe — gives slow-starting containers time before liveness kicks in
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.targetPort }}
            failureThreshold: 30
            periodSeconds: 10
          # Liveness probe — restarts the container if it becomes unhealthy
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          # Readiness probe — removes pod from Service endpoints until it's ready
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          {{- if .Values.secretProviderClass.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          {{- end }}
      {{- if .Values.secretProviderClass.enabled }}
      # CSI volume — the driver mounts this, reads from Key Vault, and
      # creates a Kubernetes Secret (referenced in envFrom above)
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.secretProviderClass.name }}
      {{- end }}
