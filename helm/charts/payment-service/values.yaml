image:
  repository: acrazureshopdev.azurecr.io/payment-service
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 3005
  targetPort: 3005

env:
  - name: PORT
    value: "3005"
  - name: NODE_ENV
    value: "production"

# Key Vault CSI — injects SQL credentials as env vars
secretProviderClass:
  enabled: true
  name: payment-service-secrets
  secretName: payment-service-secrets
  # Injected env vars: SQL_SERVER, SQL_USER, SQL_PASSWORD

probes:
  path: /health

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

hpa:
  minReplicas: 2
  maxReplicas: 10
  cpuUtilizationPercentage: 70

serviceAccount:
  annotations: {}
