# CI Pipeline — product-service (Python / FastAPI)
# Triggers: any push/PR to dev that touches services/product-service/**

trigger:
  branches:
    include:
      - dev
      - feature/*
  paths:
    include:
      - services/product-service/**

pr:
  branches:
    include:
      - dev
  paths:
    include:
      - services/product-service/**

pool:
  vmImage: ubuntu-latest

variables:
  - group: vg-common
  - name: SERVICE_NAME
    value: product-service
  - name: DOCKERFILE_PATH
    value: services/product-service
  - name: NEXT_PUBLIC_API_URL
    value: http://localhost:8080

stages:
  - stage: CI
    displayName: 'CI — product-service'
    jobs:
      - job: BuildAndPush
        displayName: 'Build, Scan & Push'
        steps:
          - template: ../templates/build-template.yaml
            parameters:
              serviceName: $(SERVICE_NAME)
              dockerfilePath: $(DOCKERFILE_PATH)
              imageTag: $(Build.BuildId)
              runTests: true
